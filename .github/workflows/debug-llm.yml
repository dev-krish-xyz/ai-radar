name: debug-llm

on:
  workflow_dispatch: {}

jobs:
  debug-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run synthetic Groq classification test
        run: bun run apps/worker/src/synthetic_llm_test.ts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
