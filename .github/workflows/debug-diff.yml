name: debug-diff

on:
  workflow_dispatch: {}

jobs:
  debug-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dump last-two-snapshot diffs
        run: bun run apps/worker/src/debug_diff.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
